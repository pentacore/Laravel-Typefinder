name: Release

# Version-only workflow. Runs semantic-release to analyse conventional
# commits on master, update CHANGELOG.md + package.json / composer.json /
# Version.php, commit the bump back to master, and push a `v…` tag.
# Actual publishing (npm + GitHub Release + Packagist) happens in
# `publish.yml`, which is triggered by the tag push.

on:
  workflow_run:
    workflows: ['Tests']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run semantic-release in dry-run mode (no tag, no commit)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT }}

      # A workflow_run job checks out master's current HEAD, which may be a
      # newer commit than the one Tests just passed on. semantic-release must
      # run on the master branch, so instead of checking out the tested sha
      # (a detached HEAD) we skip when master has moved on: the newer
      # commit's own Tests run triggers its release.
      - name: Check master is still the tested commit
        id: guard
        if: github.event_name == 'workflow_run'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$TESTED_SHA" ]; then
            echo "::notice::master is at $HEAD_SHA but Tests passed on $TESTED_SHA; skipping, the newer commit releases after its own Tests run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          # semantic-release 26 requires Node >= 26.13.
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root deps
        if: steps.guard.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund

      - name: Run semantic-release
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
